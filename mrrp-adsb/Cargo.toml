[package]
name = "mrrp-adsb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytemuck = "1.25.0"
bytes = "1.11.1"
chrono = "0.4.45"
crc = "3.4.0"
futures-util = "0.3.32"
hex = { version = "0.4.3", optional = true }
mrrp-core.workspace = true
num-complex = "0.4.6"
pin-project-lite = "0.2.17"
serde = { version = "1.0.228", optional = true }
serde_with = { version = "3.21.0", optional = true }
thiserror = "2.0.18"
tokio = "1.52.3"
tracing = "0.1.44"
uuid = "1.23.3"

[dev-dependencies]
approx = "0.5.1"

[features]
default = ["serde", "rtl_adsb_command"]
serde = ["dep:serde", "dep:serde_with"]
rtl_adsb_command = ["tokio/process", "dep:hex"]
