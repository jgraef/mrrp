[package]
name = "mrrp-rtl-sdr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bitfield = "0.19.4"
derive_more = { version = "2.1.1", features = ["debug", "from", "into"] }
futures-util = "0.3.32"
nusb = { version = "0.2.3", features = ["tokio"] }
parking_lot = "0.12.5"
paste = "1.0.15"
pretty-hex = "0.4.2"
thiserror = "2.0.18"
tokio = { version = "1.52.3", default-features = false, features = [
    "rt",
    "time",
] }
tracing = "0.1.44"
