[package]
name = "mrrp-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies.mrrp]
path = "../mrrp"

[dependencies]
biquad = "0.6.0"
chrono = { workspace = true, features = ["clock", "serde"] }
ciborium = "0.2.2"
clap.workspace = true
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream", "serde"] }
csv = "1.3.1"
derive_more = { workspace = true, features = ["debug"] }
directories = "6.0.0"
dotenvy.workspace = true
futures-util.workspace = true
num-complex = { workspace = true, features = ["serde"] }
palette = { version = "0.7.6", features = ["serde", "serializing"] }
parking_lot.workspace = true
ratatui = { version = "0.30.0", features = ["palette", "serde"] }
rodio = { version = "0.22.2", default-features = false, features = [
    "playback",
] }
rtlsdr-async = { workspace = true }
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.2"
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir = "2.5.0"
