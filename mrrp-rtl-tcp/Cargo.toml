[package]
name = "mrrp-rtl-tcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1.11.1"
futures-util = { version = "0.3.32", default-features = false, features = [
    "sink",
] }
pin-project-lite = "0.2.17"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "net", "io-util", "sync"] }
tokio-stream = { version = "0.1.18", default-features = false }
tokio-util = { version = "0.7.18", features = ["codec"] }
tracing = "0.1.44"
