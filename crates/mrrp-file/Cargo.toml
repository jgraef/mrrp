[package]
name = "mrrp-file"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
byteorder = { version = "1.5.0", optional = true }
derive_more = { workspace = true, features = ["debug"], optional = true }
hound = { version = "3.5.1", optional = true }
mrrp-core.workspace = true
mrrp-miq = { workspace = true, optional = true }
mrrp-util = { workspace = true, optional = true }
num-complex.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"], optional = true }
tracing.workspace = true

[features]
default = []
full = ["wav", "miq", "riff"]
wav = ["dep:hound", "dep:mrrp-util", "dep:derive_more", "dep:tokio"]
riff = ["dep:byteorder"]
miq = ["dep:mrrp-miq"]
