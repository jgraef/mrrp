[package]
name = "mrrp-file"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-compression = { version = "0.4.51", features = ["tokio"] }
byteorder = { workspace = true, features = ["std"], optional = true }
bytes.workspace = true
derive_more = { workspace = true, features = ["debug"], optional = true }
hound = { version = "3.5.1", optional = true }
mrrp-core.workspace = true
mrrp-miq = { workspace = true, optional = true }
mrrp-util = { workspace = true, optional = true }
num-complex.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
# TODO: rt feature is only needed for tokio::coop, which we can remove once we stop using sync io
tokio = { workspace = true, features = ["rt"], optional = true }
tracing.workspace = true

[dev-dependencies]
byteorder = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "macros"] }
zstd = "0.14.3"

[features]
default = []
full = ["all-formats", "all-compressions"]
all-formats = ["wav", "miq", "riff", "ziq"]
all-compressions = []
wav = ["dep:hound", "dep:mrrp-util", "dep:derive_more", "dep:tokio"]
riff = ["dep:byteorder"]
miq = ["dep:mrrp-miq"]
ziq = ["dep:serde", "dep:serde_json"]
zstd = ["async-compression/zstd"]
