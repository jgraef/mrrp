[package]
name = "mrrp-format"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-compression.workspace = true
byteorder = { workspace = true, features = ["std"], optional = true }
bytes.workspace = true
derive_more = { workspace = true, features = ["debug"] }
hound = { version = "3.5.1", optional = true }
mrrp-core.workspace = true
mrrp-miq = { workspace = true, optional = true }
num-complex.workspace = true
pin-project-lite.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true

[dev-dependencies]
byteorder = { workspace = true, features = ["std"] }
mrrp-util.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
zstd = "0.14.3"

[features]
default = []
full = ["all-formats", "all-compressions"]
all-formats = ["pcm", "wav", "miq", "riff", "ziq"]
all-compressions = ["zstd"]

pcm = []
wav = ["dep:hound", "tokio/rt"]
riff = ["dep:byteorder"]
miq = ["dep:mrrp-miq"]
ziq = ["dep:serde", "dep:serde_json", "pcm"]

zstd = ["async-compression/zstd"]
