[package]
name = "mrrp-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
colorgrad = { workspace = true, features = ["preset"] }
const-hex.workspace = true
crossterm = { version = "0.29.0", features = ["event-stream"] }
derive_more = { workspace = true, features = ["debug"] }
directories = "6.0.0"
dotenvy.workspace = true
flume = "0.12.0"
futures-util.workspace = true
hexyl = "0.17.0"
humansize = "2.1.3"
humantime = "2.3.0"
image = "0.25.10"
indicatif = "0.18.6"
md-5 = "0.11.0"
mrrp-adsb.workspace = true
mrrp-audio = { workspace = true, features = ["rodio", "wav"] }
mrrp-core.workspace = true
mrrp-filter = { workspace = true, features = ["biquad", "pm-remez"] }
mrrp-format = { workspace = true, features = ["full"] }
mrrp-geo.workspace = true
mrrp-modem.workspace = true
mrrp-plex.workspace = true
mrrp-rtl-sdr = { workspace = true, features = ["mrrp"] }
mrrp-rtl-tcp.workspace = true
mrrp-sat = { workspace = true, features = ["doppler-correct"] }
mrrp-sstv = { workspace = true, features = ["image", "serde"] }
mrrp-util.workspace = true
num-traits.workspace = true
parking_lot.workspace = true
pin-project-lite.workspace = true
ratatui = { version = "0.30.2", features = ["scrolling-regions", "crossterm"] }
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true
tabled = "0.22.0"
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
    "process",
    "fs",
] }
tokio-util.workspace = true
toml.workspace = true
tower-http = { version = "0.7.1", features = ["trace"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["tracing-log"] }
