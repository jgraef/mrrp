[package]
name = "mrrp-widgets"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytemuck.workspace = true
colorgrad = { version = "0.8.0", optional = true, default-features = false }
egui.workspace = true
egui-wgpu = { version = "0.34.2", default-features = false }
