[package]
name = "mrrp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mrrp-audio = { workspace = true, features = ["full"], optional = true }
mrrp-adsb = { workspace = true, features = ["full"], optional = true }
mrrp-core.workspace = true
mrrp-filter = { workspace = true, features = ["full"], optional = true }
mrrp-format = { workspace = true, features = ["full"], optional = true }
mrrp-geo = { workspace = true, features = ["full"], optional = true }
mrrp-modem = { workspace = true, optional = true }
mrrp-rtl-sdr = { workspace = true, optional = true, features = ["mrrp"] }
mrrp-rtl-tcp = { workspace = true, optional = true }
mrrp-sat = { workspace = true, optional = true }
mrrp-sstv = { workspace = true, optional = true, features = ["full"] }
mrrp-util = { workspace = true, optional = true }

[[bench]]
name = "buffering"
harness = false

[dev-dependencies]
anyhow.workspace = true
clap.workspace = true
criterion = "0.8.2"
dotenvy.workspace = true
futures-util.workspace = true
num-complex.workspace = true
num-traits.workspace = true
pin-project-lite.workspace = true
rand.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["full"]
full = [
    "audio",
    "filter",
    "geo",
    "modem-full",
    "rtl_sdr",
    "rtl_tcp",
    "sat",
    "util",
]
modem-full = ["modem-base", "adsb", "sstv"]

audio = ["dep:mrrp-audio"]
adsb = ["dep:mrrp-adsb"]
filter = ["dep:mrrp-filter"]
format = ["dep:mrrp-format"]
geo = ["dep:mrrp-geo"]
modem-base = ["dep:mrrp-modem"]
rtl_sdr = ["dep:mrrp-rtl-sdr"]
rtl_tcp = ["dep:mrrp-rtl-tcp"]
sat = ["dep:mrrp-sat"]
sstv = ["dep:mrrp-sstv"]
util = ["dep:mrrp-util"]
