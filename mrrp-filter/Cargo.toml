[package]
name = "mrrp-filter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argmin = { version = "0.11.0", optional = true }
argmin-math = { version = "0.5.1", features = [
    "nalgebra_latest",
], optional = true }
biquad = { version = "0.6.0", optional = true }
derive_more = { workspace = true, features = ["debug"] }
mrrp-core.workspace = true
mrrp-util.workspace = true
num-complex.workspace = true
num-traits.workspace = true
pin-project-lite.workspace = true
pm-remez = { version = "0.3.4", default-features = false, features = [
    "nalgebra-backend",
], optional = true }
rustfft = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
approx = "0.5.1"
tokio = { workspace = true, features = ["rt"] }

[features]
default = []
full = ["argmin", "biquad", "equiripple_fft", "pm-remez"]
argmin = ["dep:argmin", "dep:argmin-math"]
biquad = ["dep:biquad"]
equiripple_fft = ["dep:rustfft"]
pm-remez = ["dep:pm-remez"]
